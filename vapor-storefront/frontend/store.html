<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vapor Storefront</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Vapor</h1>
  <div id="navbar-container"></div>

<script>
  fetch("navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar-container").innerHTML = html;

      // Re-run any scripts inside navbar.html
      const scripts = document
        .getElementById("navbar-container")
        .querySelectorAll("script");

      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });
    });
</script>


  <div id="products"></div>

  <script>
    const API = "http://localhost:8080";

    // 1. Load products
    async function loadProducts() {
      const res = await fetch(`${API}/products`);
      const products = await res.json();

      const container = document.getElementById("products");
      container.innerHTML = "";

      products.forEach(p => {
        const div = document.createElement("div");
        div.className = "product";

        const isOwned = owned.includes(p.product_id);

        div.innerHTML = `
          <h2>${p.name}</h2>
          <p>${p.description}</p>
          <strong>$${p.price}</strong><br><br>

          ${
            isOwned
              ? `<span class="owned-badge">Already Owned</span>`
              : `<button onclick="addToCart('${p.product_id}')">Add to Cart</button>`
          }
        `;
        
      container.appendChild(div);
});

    }

    // 2. Checkout
    async function addToCart(productId) {
      const token = localStorage.getItem("jwt");

      if (!token) {
        alert("You must log in first.");
        window.location.href = "login.html";
        return;
      }

      const res = await fetch(`${API}/cart/add`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ product_id: productId })
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Failed to add to cart");
        return;
      }

      alert("Added to cart!");
}

    let owned = [];

    async function loadOwned() {
      const token = localStorage.getItem("jwt");
      if (!token) return;

      const res = await fetch(`${API}/library`, {
        headers: { Authorization: "Bearer " + token }
      });

      const data = await res.json();
      owned = data.map(item => item.product_id);
    }

    async function init() {
      await loadOwned();
      await loadProducts();
    }

    init();

  </script>

</body>
</html>
